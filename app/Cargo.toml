[package]
name = "end-scaling"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "EndScaling"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
# Keep a matching PDB so native crash-dump addresses can be symbolized.
debug = 1
